name: deploy

# main is the trunk (redesign points at the same commit). Deploys also run on
# demand from any branch, which is how you ship a branch without merging first.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: build and publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://www.ethanzhou.ca

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Nothing reaches the live site without passing the same gate as CI.
      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build

      # public/CNAME exists precisely because a deploy once dropped the custom
      # domain. Fail loudly here rather than find out from the browser.
      - name: Check the custom domain survived the build
        run: |
          test -f build/CNAME || {
            echo "::error::build/CNAME is missing — publishing this would drop ethanzhou.ca"
            exit 1
          }
          grep -q 'ethanzhou.ca' build/CNAME || {
            echo "::error::build/CNAME does not contain ethanzhou.ca"
            exit 1
          }

      # Published with plain git rather than a third-party action: gh-pages is
      # a branch of build output, and this is the whole of what that takes.
      - name: Publish
        run: |
          cd build
          touch .nojekyll
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
